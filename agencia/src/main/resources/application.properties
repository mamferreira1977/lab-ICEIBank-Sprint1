spring.application.name=iceibank-agencia
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always

agencia.id=0
agencia.offset=0

# JWT - valores padrão locais para o Sprint 1.
# Podem ser sobrescritos por variáveis de ambiente em produção/testes.
jwt.secret=${JWT_SECRET:ICEIBank-Sprint1-chave-secreta-local-com-mais-de-32-bytes}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:600}

# Chave usada apenas na comunicação interna entre agências.
iceibank.internal-key=${INTERNAL_API_KEY:iceibank-internal-sprint1}

iceibank.data-dir=${ICEIBANK_DATA_DIR:}
